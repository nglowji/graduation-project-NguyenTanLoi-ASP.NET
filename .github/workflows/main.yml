name: SmartSport CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend (ASP.NET Core) Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore server/SportsPitchBooking.sln
      
    - name: Build
      run: dotnet build server/SportsPitchBooking.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test server/SportsPitchBooking.sln --no-build --configuration Release --verbosity normal

  frontend-build-deploy:
    name: Frontend (React) Build & Deploy
    runs-on: ubuntu-latest
    needs: backend-build-test
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      working-directory: ./client
      run: npm install --legacy-peer-deps
      
    - name: Build Project
      working-directory: ./client
      run: npm run build

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Pull Vercel Environment
      working-directory: ./client
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build Project Artifacts (Vercel)
      working-directory: ./client
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy Project Artifacts to Vercel
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      working-directory: ./client
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  backend-deploy:
    name: Backend (ASP.NET) Deploy to Render
    runs-on: ubuntu-latest
    needs: backend-build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - name: Trigger Render Deployment
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        curl -X POST "$DEPLOY_HOOK"
        echo "Successfully triggered Render deployment."
