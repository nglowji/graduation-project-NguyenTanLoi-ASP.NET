name: SmartSport CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend (ASP.NET Core) Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore server/SportsPitchBooking.sln
      
    - name: Build
      run: dotnet build server/SportsPitchBooking.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test server/SportsPitchBooking.sln --no-build --configuration Release --verbosity normal

  frontend-build-deploy:
    name: Frontend (React) Build & Deploy
    runs-on: ubuntu-latest
    needs: backend-build-test
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      working-directory: ./client
      run: npm install --legacy-peer-deps
      
    - name: Build
      working-directory: ./client
      run: npm run build

    - name: Deploy to Vercel
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./client
        vercel-version: latest
        vercel-args: '--prod'
